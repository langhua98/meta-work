name: Build 小橘双机 app

# 小橘双机（src/xiaoju-pipe/）：两台 iPhone 合跑 Qwen3.5。
#   e2e：Linux 上用随机权重的小模型跑主机 + 从机（拆两段、从机中途被杀后自动重连、旧连接挂死），不用下载模型。
#   test：Mac 上编译命令行工具、跑单元测试，再用 Qwen3.5-0.8B 对照 Metal 内核和 CPU 参考实现的结果、对照官方分词器。
#   ios：XcodeGen 生成工程，编译没签名的 .ipa（最低 iOS 15，7 Plus 能装），发布到 Release「xiaoju-pipe」；
#        main 上的构建再传到小橘云盘「软件包」（文件名带版本号和构建号，旧包删掉），要 secret XIAOJU_TOKEN。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "用哪种 Mac（macos-26 排不上时换 macos-15）"
        default: macos-26
  push:
    paths:
      - "src/xiaoju-pipe/**"
      - ".github/workflows/xiaoju-pipe.yml"
      - "scripts/upload_package.py"

permissions:
  contents: write

concurrency:
  group: xiaoju-pipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/xiaoju-pipe
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit tests
        run: make -j4 && make test
      - name: Host + worker end to end (tiny random model, reconnect)
        run: |
          python3 -c "import numpy" 2>/dev/null || pip3 install numpy
          OMP_NUM_THREADS=1 make e2e
      - name: App 里的模型链接支持分段下载（HTTP Range → 206）
        run: |
          # App 先用 Range 拿文件头（16 MB），再只下从机那几层；这里用和 App 一样的请求测一遍
          fail=0
          for host in huggingface.co hf-mirror.com; do
            for path in unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf; do
              url="https://$host/$path"
              out=$(curl -sS -L -r 0-16777215 -o /tmp/head.gguf --max-time 120 \
                -w '%{http_code} %{size_download} %{time_total}s %{num_redirects} 次跳转 → %{url_effective}' "$url" 2>&1) || true
              echo "$host $(basename "$path")：$out" | cut -c1-300
              set -- $out
              if [ "$1" != 206 ] || [ "$2" != 16777216 ]; then
                echo "::warning::$url 分段下载不正常：$out"
                [ "$host" = huggingface.co ] && fail=1
              fi
            done
          done
          ./build/gguf-dump /tmp/head.gguf 2>&1 | head -3 || true
          exit $fail

  test:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    defaults:
      run:
        working-directory: src/xiaoju-pipe
    steps:
      - uses: actions/checkout@v4
      - name: Build command-line tools
        run: make CFLAGS="-O2 -Wall -Wno-unknown-pragmas -fobjc-arc"
      - name: Unit tests
        run: make test CFLAGS="-O2 -Wall -Wno-unknown-pragmas -fobjc-arc"
      - name: Check iOS 15 Metal compile (A10 / Apple3)
        run: |
          # 和 7 Plus 一样的目标：iOS 15，看内核有没有用到 A10 没有的东西
          xcrun -sdk iphoneos metal -std=ios-metal2.4 -mios-version-min=15.0 -I metal -c metal/xj_kernels.metal -o /tmp/k.air
          xcrun -sdk iphoneos metallib /tmp/k.air -o /tmp/k.metallib
          ls -l /tmp/k.metallib
      - uses: actions/cache@v4
        with:
          path: ~/models
          key: qwen35-08b-q4km
      - name: Download Qwen3.5-0.8B (same architecture, 0.5 GB)
        run: |
          mkdir -p ~/models
          f=~/models/Qwen3.5-0.8B-Q4_K_M.gguf
          [ -s "$f" ] || curl -fL --retry 5 -o "$f" https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf
          ls -l "$f"
      - name: Metal vs CPU (every kernel, both layer types, output head)
        run: |
          f=~/models/Qwen3.5-0.8B-Q4_K_M.gguf
          system_profiler SPDisplaysDataType | head -20 || true
          ./build/xjpipe-check "$f" --layers 0:8
          ./build/xjpipe-check "$f" --layers 16:24
      - name: Tokenizer vs official tokenizer.json
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q tokenizers
          for repo in Qwen/Qwen3.5-0.8B unsloth/Qwen3.5-0.8B; do
            curl -fsL --retry 3 -o /tmp/tokenizer.json "https://huggingface.co/$repo/resolve/main/tokenizer.json" && break
          done
          ls -l /tmp/tokenizer.json
          /tmp/venv/bin/python tests/tok_check.py ~/models/Qwen3.5-0.8B-Q4_K_M.gguf /tmp/tokenizer.json
      - name: Two processes over TCP (Metal worker on layers 8-15)
        run: |
          f=~/models/Qwen3.5-0.8B-Q4_K_M.gguf
          ./build/gguf-slice "$f" /tmp/slice.gguf 8:16
          ./build/xjpipe-worker /tmp/slice.gguf --layers 8:16 --pin 1234 > /tmp/worker.log 2>&1 &
          sleep 3
          ./build/xjpipe-host "$f" "用一句话介绍一下北京。" --worker 127.0.0.1 --pin 1234 --n 24 | tee /tmp/split.txt
          ./build/xjpipe-host "$f" "用一句话介绍一下北京。" --n 24 | tee /tmp/solo.txt
          kill %1 || true
          cat /tmp/worker.log
          # 两边都是同一套 Metal 内核，贪心解码应该一字不差
          diff /tmp/split.txt /tmp/solo.txt && echo "拆分和单机输出一致"

  ios:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        working-directory: src/xiaoju-pipe/ios
        run: |
          xcodegen generate
          xcodebuild -project XiaojuPipe.xcodeproj -scheme XiaojuPipe -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          app=build/Build/Products/Release-iphoneos/XiaojuPipe.app
          [ -f "$app/default.metallib" ] || { echo "::error::default.metallib 没编进 App（Metal 内核）"; exit 1; }
          min=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")
          echo "最低 iOS $min"
          [ "$min" = "15.0" ] || { echo "::error::最低系统不是 iOS 15（7 Plus 装不上）"; exit 1; }
          mkdir Payload && cp -R "$app" Payload/
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          ipa="XiaojuPipe-$version-build$GITHUB_RUN_NUMBER.ipa"
          zip -qry "$GITHUB_WORKSPACE/$ipa" Payload
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IPA=$ipa" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}
      - name: Publish to the xiaoju-pipe release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete xiaoju-pipe --yes --cleanup-tag || true
          cp "$IPA" XiaojuPipe-latest.ipa
          gh release create xiaoju-pipe "$IPA" XiaojuPipe-latest.ipa --prerelease \
            --title "小橘双机 ${VERSION}（构建 ${GITHUB_RUN_NUMBER}）" \
            --notes "没签名的测试版（${GITHUB_REF_NAME} ${GITHUB_SHA::7}），两台手机都装这一个，用 SideStore 或自己的证书签名。见 src/xiaoju-pipe/README.md。"
      - name: Upload to 小橘云盘 /软件包/
        # 放在发布 Release 之后：云盘传不上也不影响 Release 里的 ipa
        if: github.ref == 'refs/heads/main'
        env:
          XIAOJU_TOKEN: ${{ secrets.XIAOJU_TOKEN }}
        run: |
          if [ -z "$XIAOJU_TOKEN" ]; then
            echo "::error::仓库没有 secret XIAOJU_TOKEN（有写权限的 xa_ 令牌），ipa 没传到小橘云盘。到 Settings → Secrets and variables → Actions 里加上再重跑这一步。"
            exit 1
          fi
          python3 scripts/upload_package.py "$IPA" XiaojuPipe-
