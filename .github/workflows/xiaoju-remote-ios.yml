name: Build 小橘遥控 ipa

# src/xiaoju-remote-ios/：GitHub 的 Mac 机器上 xcodegen 生成工程再编译，
# 没签名的 .ipa 发布到 Release「xiaoju-remote-ios」（每次覆盖），用 SideStore / 自己的证书签名后安装。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "用哪种 Mac（macos-26 排不上时换 macos-15-intel）"
        default: macos-26
  push:
    paths:
      - "src/xiaoju-remote-ios/**"
      - ".github/workflows/xiaoju-remote-ios.yml"

permissions:
  contents: write

concurrency:
  group: xiaoju-remote-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build (unsigned)
        working-directory: src/xiaoju-remote-ios
        run: |
          xcodegen generate
          xcodebuild -project XiaojuRemote.xcodeproj -scheme XiaojuRemote -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          app=build/Build/Products/Release-iphoneos/XiaojuRemote.app
          [ -d "$app" ] || { echo "::error::没编出 $app"; exit 1; }
          mkdir Payload && cp -R "$app" Payload/
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          ipa="XiaojuRemote-$version-build$GITHUB_RUN_NUMBER.ipa"
          zip -qry "$GITHUB_WORKSPACE/$ipa" Payload
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IPA=$ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}

      - name: Publish to the xiaoju-remote-ios release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete xiaoju-remote-ios --yes --cleanup-tag || true
          cp "$IPA" XiaojuRemote-latest.ipa
          gh release create xiaoju-remote-ios "$IPA" XiaojuRemote-latest.ipa --prerelease --target "$GITHUB_SHA" \
            --title "小橘遥控 ${VERSION}（构建 ${GITHUB_RUN_NUMBER}）" \
            --notes "没签名的测试版，需要用 SideStore 或自己的证书签名后安装。见 src/xiaoju-remote-ios/README.md。"
