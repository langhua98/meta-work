name: Build 小橘推送 app

# 小橘推送（src/xiaoju-push/）：在 GitHub 的 Mac 机器上用 XcodeGen 生成工程再编译，
# 没签名的 .ipa 发布到 Release「xiaoju-push」（每次覆盖），用 SideStore / 自己的证书签名安装。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "用哪种 Mac（macos-26 排不上时换 macos-15-intel）"
        default: macos-26
  push:
    paths:
      - "src/xiaoju-push/**"
      - ".github/workflows/xiaoju-push.yml"

permissions:
  contents: write

concurrency:
  group: xiaoju-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid
      - name: Download llama.cpp XCFramework
        working-directory: src/xiaoju-push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用最新一个带 xcframework 的 llama.cpp 正式版（Qwen3.5 需要较新的版本）
          for tag in $(gh release list -R ggml-org/llama.cpp -L 15 --exclude-drafts --json tagName -q '.[].tagName'); do
            if gh release download "$tag" -R ggml-org/llama.cpp -p "llama-$tag-xcframework.zip" -D /tmp/llama; then
              LLAMA_TAG=$tag; break
            fi
          done
          [ -n "$LLAMA_TAG" ] || { echo "::error::找不到 llama.cpp 的 xcframework"; exit 1; }
          echo "llama.cpp $LLAMA_TAG"
          unzip -q "/tmp/llama/llama-$LLAMA_TAG-xcframework.zip" -d /tmp/llama
          mkdir -p Vendor
          rm -rf Vendor/llama.xcframework
          mv /tmp/llama/build-apple/llama.xcframework Vendor/
          ls Vendor/llama.xcframework
      # 下载过的框架留着下次用（GitHub 下载偶尔一直 504）
      - uses: actions/cache@v4
        with:
          path: ~/dl-cache
          key: xiaoju-vendor-${{ hashFiles('.github/workflows/xiaoju-push.yml') }}
          restore-keys: xiaoju-vendor-
      - name: Download ios_system frameworks (本机命令)
        working-directory: src/xiaoju-push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a-Shell 作者发布的编译好的框架；版本和校验值跟 a-Shell 的 xcfs/Package.swift 一致
          mkdir -p Vendor ~/dl-cache
          while read -r url sum; do
            [ -n "$url" ] || continue
            f=~/dl-cache/$(basename "$url")
            if ! echo "$sum  $f" | shasum -a 256 -c - >/dev/null 2>&1; then
              # 直链不行就走 API 下（github.com/OWNER/REPO/releases/download/TAG/NAME）
              IFS=/ read -r _ _ _ owner repo _ _ tag name <<< "$url"
              curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$f" "$url" ||
                gh release download "$tag" -R "$owner/$repo" -p "$name" -D ~/dl-cache --clobber
            fi
            echo "$sum  $f" | shasum -a 256 -c -
            unzip -qo "$f" -d Vendor
          done <<'EOF'
          https://github.com/holzschu/ios_system/releases/download/v3.0.5/ios_system.xcframework.zip d429e68102926f58bedd8e8b7105dcd169478cd6da1cef494a5f468482d1c8f5
          https://github.com/holzschu/ios_system/releases/download/v3.0.5/files.xcframework.zip b0ee1f58c65ba306f178cd559fd6bce79ec8f275280526908c2a992bfcafedd5
          https://github.com/holzschu/ios_system/releases/download/v3.0.5/text.xcframework.zip 6fed763c6e941817b2a2af2051871bdfb8a1af4177fad1ab7837f72023dffb79
          https://github.com/holzschu/ios_system/releases/download/v3.0.5/shell.xcframework.zip 855ff9b12bfbbdbd5298324377d91e18e6ac97dbb19d3c9311ce5a023ee51b2e
          https://github.com/holzschu/ios_system/releases/download/v3.0.5/awk.xcframework.zip 283f368df6c44ed9d49d15651ca4281706cdd86eb2b6ddb81808c8a3b18a4f7d
          https://github.com/holzschu/ios_system/releases/download/v3.0.5/tar.xcframework.zip 207ab260f8dfb3101938c9e2a949cfd7b76f0e90a000637bbfd6aff47b014a68
          https://github.com/holzschu/ios_system/releases/download/v3.0.5/curl_ios.xcframework.zip d7e2f05c9f2689d103db32f83ab045bfb6ab28ce84e3017e0c23e4b4db7ab169
          https://github.com/holzschu/ios_system/releases/download/Auxiliary/dash.xcframework.zip 9a30ac6b3780dd68d2268d10467902214e32333e980c59090faa6099f0d250fc
          https://github.com/holzschu/libgit2/releases/download/ios_1.0/lg2.xcframework.zip 7d205a771be8d120a80d2f7281135dfffd21a3713c86eb4f1957638f6b4b365e
          https://github.com/holzschu/openssl-apple/releases/download/v1.1.1w/openssl-dynamic.xcframework.zip 329e8317cf9bee8e138da5d032330a7a1bd2473cf44c9c083cb2f0636abb8b80
          https://github.com/holzschu/libssh2-apple/releases/download/v1.11.0/libssh2-dynamic.xcframework.zip cacfe1789b197b727119f7e32f561eaf9acc27bf38cd19975b74fce107f868a6
          https://github.com/holzschu/ios_system/releases/download/v3.0.5/ssh_cmd.xcframework.zip 0943d53cfec57909fbdb121bafa3d1845a82e7accf896e1dd7864aa640a57836
          https://github.com/fprimex/jq/releases/download/ios/jq.xcframework.zip d3c4486e5ed788995b0ad9586465d3407e463d90f4e91b843846cabfe21f297f
          EOF
          ls Vendor
      - name: Download Python (python3 命令)
        working-directory: src/xiaoju-push
        run: |
          # BeeWare 打包的官方 CPython 3.13 iOS 版（PEP 730），固定版本
          url=https://github.com/beeware/Python-Apple-support/releases/download/3.13-b18/Python-3.13-iOS-support.b18.tar.gz
          f=~/dl-cache/$(basename "$url")
          mkdir -p ~/dl-cache /tmp/python-ios Vendor
          [ -s "$f" ] || curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$f" "$url" ||
            GH_TOKEN=${{ github.token }} gh release download 3.13-b18 -R beeware/Python-Apple-support -p "$(basename "$url")" -D ~/dl-cache --clobber
          shasum -a 256 "$f"
          tar -xzf "$f" -C /tmp/python-ios
          rm -rf Vendor/Python.xcframework
          mv /tmp/python-ios/Python.xcframework Vendor/
          cat /tmp/python-ios/VERSIONS || true
          ls Vendor/Python.xcframework Vendor/Python.xcframework/ios-arm64
      - name: Build
        working-directory: src/xiaoju-push
        run: |
          xcodegen generate
          xcodebuild -project XiaojuPush.xcodeproj -scheme XiaojuPush -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          app=build/Build/Products/Release-iphoneos/XiaojuPush.app
          # 小组件必须嵌进 App
          if [ ! -d "$app/PlugIns/XiaojuPushWidget.appex" ]; then
            echo "::error::$app/PlugIns/XiaojuPushWidget.appex 不存在（小组件没嵌进 App）"
            exit 1
          fi
          # 没签名编译不会写入 entitlements，SideStore 就不知道要 App Group。用 ldid 先假签名写进去（先小组件，再主程序）。
          scripts/install-python.sh "$app" Vendor/Python.xcframework com.langhua98.xiaoju.push
          [ -f "$app/Frameworks/Python.framework/Python" ] || { echo "::error::Python.framework 没嵌进 App"; exit 1; }
          # ios_system 用 dlsym 在主程序里找这些命令
          for sym in xiaoju_python3_main xiaoju_pip_main xiaoju_sqlite3_main xiaoju_node_main; do
            nm -gU "$app/XiaojuPush" | grep -q "_$sym\$" || { echo "::error::主程序里找不到 ${sym}（这个命令会跑不了）"; exit 1; }
          done
          ldid -S"Widget/XiaojuPushWidget.entitlements" "$app/PlugIns/XiaojuPushWidget.appex/XiaojuPushWidget"
          ldid -S"App/XiaojuPush.entitlements" "$app/XiaojuPush"
          for f in ios_system files text shell awk tar curl_ios dash lg2 openssl libssh2 ssh_cmd jq; do
            [ -d "$app/Frameworks/$f.framework" ] || { echo "::error::$f.framework 没嵌进 App"; exit 1; }
          done
          [ -f "$app/commandDictionary.plist" ] || { echo "::error::commandDictionary.plist 不在 App 根目录"; exit 1; }
          du -sh "$app/Frameworks"/*.framework
          if [ ! -d "$app/Frameworks/llama.framework" ]; then
            echo "::error::llama.framework 没嵌进 App"
            exit 1
          fi
          mkdir Payload && cp -R "$app" Payload/
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          ipa="XiaojuPush-$version-build$GITHUB_RUN_NUMBER.ipa"
          zip -qry "$GITHUB_WORKSPACE/$ipa" Payload
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IPA=$ipa" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}
      - name: Publish to the xiaoju-push release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete xiaoju-push --yes --cleanup-tag || true
          gh release create xiaoju-push "$IPA" --prerelease --target "$GITHUB_SHA" \
            --title "小橘推送 ${VERSION}（构建 ${GITHUB_RUN_NUMBER}）" \
            --notes "没签名的测试版（${GITHUB_REF_NAME} ${GITHUB_SHA::7}），需要用 SideStore 或自己的证书签名后安装。见 src/xiaoju-push/README.md。"
