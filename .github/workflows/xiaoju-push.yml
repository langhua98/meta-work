name: Build 小橘推送 app

# 小橘推送（src/xiaoju-push/）：在 GitHub 的 Mac 机器上用 XcodeGen 生成工程再编译，
# 没签名的 .ipa 发布到 Release「xiaoju-push」（每次覆盖），用 SideStore / 自己的证书签名安装。
on:
  workflow_dispatch:
  push:
    paths:
      - "src/xiaoju-push/**"
      - ".github/workflows/xiaoju-push.yml"

permissions:
  contents: write

concurrency:
  group: xiaoju-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid
      - name: Download llama.cpp XCFramework
        working-directory: src/xiaoju-push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用最新一个带 xcframework 的 llama.cpp 正式版（Qwen3.5 需要较新的版本）
          for tag in $(gh release list -R ggml-org/llama.cpp -L 15 --exclude-drafts --json tagName -q '.[].tagName'); do
            if gh release download "$tag" -R ggml-org/llama.cpp -p "llama-$tag-xcframework.zip" -D /tmp/llama; then
              LLAMA_TAG=$tag; break
            fi
          done
          [ -n "$LLAMA_TAG" ] || { echo "::error::找不到 llama.cpp 的 xcframework"; exit 1; }
          echo "llama.cpp $LLAMA_TAG"
          unzip -q "/tmp/llama/llama-$LLAMA_TAG-xcframework.zip" -d /tmp/llama
          mkdir -p Vendor
          rm -rf Vendor/llama.xcframework
          mv /tmp/llama/build-apple/llama.xcframework Vendor/
          ls Vendor/llama.xcframework
      - name: Build
        working-directory: src/xiaoju-push
        run: |
          xcodegen generate
          xcodebuild -project XiaojuPush.xcodeproj -scheme XiaojuPush -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          app=build/Build/Products/Release-iphoneos/XiaojuPush.app
          # 小组件必须嵌进 App
          if [ ! -d "$app/PlugIns/XiaojuPushWidget.appex" ]; then
            echo "::error::$app/PlugIns/XiaojuPushWidget.appex 不存在（小组件没嵌进 App）"
            exit 1
          fi
          # 没签名编译不会写入 entitlements，SideStore 就不知道要 App Group。用 ldid 先假签名写进去（先小组件，再主程序）。
          ldid -S"Widget/XiaojuPushWidget.entitlements" "$app/PlugIns/XiaojuPushWidget.appex/XiaojuPushWidget"
          ldid -S"App/XiaojuPush.entitlements" "$app/XiaojuPush"
          if [ ! -d "$app/Frameworks/llama.framework" ]; then
            echo "::error::llama.framework 没嵌进 App"
            exit 1
          fi
          mkdir Payload && cp -R "$app" Payload/
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          ipa="XiaojuPush-$version-build$GITHUB_RUN_NUMBER.ipa"
          zip -qry "$GITHUB_WORKSPACE/$ipa" Payload
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IPA=$ipa" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}
      - name: Publish to the xiaoju-push release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete xiaoju-push --yes --cleanup-tag || true
          gh release create xiaoju-push "$IPA" --prerelease --target "$GITHUB_SHA" \
            --title "小橘推送 ${VERSION}（构建 ${GITHUB_RUN_NUMBER}）" \
            --notes "没签名的测试版（${GITHUB_REF_NAME} ${GITHUB_SHA::7}），需要用 SideStore 或自己的证书签名后安装。见 src/xiaoju-push/README.md。"
