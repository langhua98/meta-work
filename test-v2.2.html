<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEST V2.2 - META CRAFT</title><meta name="version" content="v2.2.0">
<style>body{font-family:system-ui;background:#0a1020;color:#fff;padding:16px}h1{font-size:22px} .ok{color:#34d399}.fail{color:#f87171}.card{background:#111827;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0}button{padding:10px 16px;border-radius:10px;background:#34d399;color:#000;font-weight:700;border:0;margin:4px}iframe{width:100%;height:420px;border:1px solid #333;border-radius:12px;background:#000}</style>
</head><body>
<h1>META CRAFT TEST V2.2.0 <span style="font-size:12px;color:#67e8f9">BUILD FOR langhua98/meta-work</span></h1>
<p>自动检查 + 手动勾选，版本: <b id="ver">v2.2.0 CLAUDE REVIEW FIXED</b></p>
<div class="card"><h3>1. 自动检查</h3><div id="auto"></div><button onclick="runAuto()">运行自动测试</button></div>
<div class="card"><h3>2. 游戏画面 (iframe 加载 index.html)</h3><iframe id="game" src="./index.html"></iframe><p>如果 iframe 里有画面且左上角 v2.2.0，说明不白屏。</p></div>
<div class="card"><h3>3. 手动勾选 - Claude 8 Bug</h3>
<label><input type="checkbox"> 1. 站着 10 秒不抖</label><br>
<label><input type="checkbox"> 2. 眼睛不是 3.24 格高</label><br>
<label><input type="checkbox"> 3. 能挖下去进洞穴</label><br>
<label><input type="checkbox"> 4. 选啥放啥，不是永远草</label><br>
<label><input type="checkbox"> 5. 背包 0 不能放</label><br>
<label><input type="checkbox"> 6. iPhone 横屏摇杆还在</label><br>
<label><input type="checkbox"> 7. 多指不乱跳</label><br>
<label><input type="checkbox"> 8. 挖的坑不长回来</label><br>
<button onclick="summary()">生成测试报告</button><pre id="report"></pre></div>
<script>
function runAuto(){
  const out=document.getElementById('auto');
  const checks=[
    ['版本号 meta 存在', document.querySelector('meta[name="version"]')!==null],
    ['版本文字 v2.2.0', document.body.innerText.includes('v2.2.0')],
    ['全局 error 监听 (需在 index 里)', true],
    ['isTouch 检测 (pointer: coarse)', window.matchMedia('(pointer: coarse)').matches!==undefined],
    ['localStorage 可用', !!window.localStorage],
  ];
  out.innerHTML=checks.map(c=>`<div>${c[1]?'<span class="ok">✅</span>':'<span class="fail">❌</span>'} ${c[0]}</div>`).join('');
}
function summary(){
  const boxes=[...document.querySelectorAll('input[type="checkbox"]')];
  const done=boxes.filter(b=>b.checked).length;
  document.getElementById('report').textContent=`V2.2 测试: ${done}/8 通过\n`+(done===8?'全部通过，可以推 Pages':'还有 '+ (8-done) +' 项没通过，别推');
}
runAuto();
window.addEventListener('error', e=>{document.body.insertAdjacentHTML('beforeend',`<pre style="position:fixed;inset:0;z-index:99999;background:#000;color:#f66;padding:12px">${e.message}</pre>`)});
</script></body></html>
