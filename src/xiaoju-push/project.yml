# 小橘推送（iPhone App）：把小橘云盘文件夹里改过的代码提交、推送到 GitHub。源码在 meta-work 仓库 src/xiaoju-push/。
# GitHub Actions 的 Mac 机器上 `xcodegen generate` 生成 Xcode 工程再编译（.github/workflows/xiaoju-push.yml）。
# 桌面小组件 XiaojuPushWidget 嵌在 App 里，两边通过 App Group 共享 Shared/WidgetSnapshot.swift 的数据。
name: XiaojuPush
options:
  bundleIdPrefix: com.langhua98.xiaoju
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  XiaojuPush:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: XiaojuPushWidget
        embed: true
      # 本地模型：llama.cpp 官方 XCFramework（最新正式版），编译时由 workflow 下载到 Vendor/（不进仓库）
      - framework: Vendor/llama.xcframework
        embed: true
      # 本机命令：a-Shell 作者的 ios_system（BSD-3）和命令框架，workflow 按固定版本 + 校验值下载到 Vendor/。
      # 只链接 ios_system；命令框架只嵌进去，跑命令时由 ios_system 按 Shell/commandDictionary.plist 加载
      - framework: Vendor/ios_system.xcframework
        embed: true
      - { framework: Vendor/files.xcframework, embed: true, link: false }
      - { framework: Vendor/text.xcframework, embed: true, link: false }
      - { framework: Vendor/shell.xcframework, embed: true, link: false }
      - { framework: Vendor/awk.xcframework, embed: true, link: false }
      - { framework: Vendor/tar.xcframework, embed: true, link: false }
      - { framework: Vendor/curl_ios.xcframework, embed: true, link: false }
      - { framework: Vendor/dash.xcframework, embed: true, link: false }
      - { framework: Vendor/lg2.xcframework, embed: true, link: false }
      - { framework: Vendor/openssl.xcframework, embed: true, link: false }
      - { framework: Vendor/libssh2.xcframework, embed: true, link: false }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.langhua98.xiaoju.push
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/XiaojuPush.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 小橘推送
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: 把模型发来的图片和视频存到相册
        NSMicrophoneUsageDescription: 按住麦克风说话，把你说的话变成文字
        NSSpeechRecognitionUsageDescription: 把你说的话变成文字发给编码助手
        # 工作区在「文件」App 里能看到
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.langhua98.xiaoju.push.refresh]
  # 桌面 / 锁屏小组件：待推文件数
  XiaojuPushWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.langhua98.xiaoju.push.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widget/XiaojuPushWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 小橘推送
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
