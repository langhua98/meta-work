# 小橘双机（iPhone App）：同一个 App 装在两台手机上，进去选「主机」或「从机」。
# 主机（15 Pro Max）算前后几层 + 输出头；从机（iPhone 7 Plus，iOS 15）用 GPU 算中间几层。
# GitHub Actions 的 Mac 上 `xcodegen generate` 生成工程再编译（.github/workflows/xiaoju-pipe.yml）。
name: XiaojuPipe
options:
  bundleIdPrefix: com.langhua98.xiaoju
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  XiaojuPipe:
    type: application
    platform: iOS
    sources:
      - App
      # 推理核心（C）和 Metal 内核，和电脑上的命令行工具是同一份
      - path: ../core
        excludes: ["*.md"]
      - path: ../metal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.langhua98.xiaoju.pipe
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge.h
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../core", "$(SRCROOT)/../metal", "$(SRCROOT)/App"]
        # xj_kernels.metal 里 #include "xj_shader_types.h"
        MTL_HEADER_SEARCH_PATHS: ["$(SRCROOT)/../metal"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 小橘双机
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: 两台手机在同一个 Wi‑Fi 里互相找到对方、传隐藏向量
        NSBonjourServices: [_xjpipe._tcp]
        # 模型文件也可以用电脑拷进「文件」App 里的小橘双机文件夹
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
